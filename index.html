<!DOCTYPE html>
<!-- Dragon Roguelike — fan game non commercial — Auteur : Charles GRATIAS -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dragon Roguelike — par Charles GRATIAS</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b12; color: #9aa0b4; font-family: monospace; overflow: hidden; }
  #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
  /* Le canvas logique 960×540 est agrandi en gardant des pixels nets */
  #game { width: min(100vw, calc((100vh - 28px) * 16 / 9)); aspect-ratio: 16 / 9; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; cursor: none; display: block; }
  footer { height: 28px; line-height: 28px; font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <footer>Dragon Roguelike — © Charles GRATIAS — Fan game non commercial, non affilié à Bird Studio/Shueisha/Toei</footer>
</div>
<!-- Simulation (sans DOM, testable sous Node) -->
<script src="src/core/rng.js"></script>
<script src="src/core/data.js"></script>
<script src="src/core/upgrades.js"></script>
<script src="src/core/game.js"></script>
<script src="src/core/combat.js"></script>
<script src="src/core/enemies.js"></script>
<script src="src/core/run.js"></script>
<!-- Vue : sprites, rendu, entrées -->
<script src="src/view/sprites.js"></script>
<script src="src/view/input.js"></script>
<script src="src/view/render.js"></script>
<script src="src/view/fx.js"></script>
<script src="src/view/hud.js"></script>
<script src="src/view/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
